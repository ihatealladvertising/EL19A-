name: EL19A CONSULT Donor Layout Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/el19a-dat-donor-batch.yml"

permissions:
  contents: read

jobs:
  diagnose-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect valid frame addresses and decoded banks
        shell: bash
        run: |
          mkdir -p donor-scan
          python3 - <<'PY'
          import re
          from pathlib import Path
          from tools.nissan_sh705x_workbench import load_any_rom
          from tools.sh7058_cross_rom_scanner import discover_helpers, extract_calls
          from tools.nissan_sh705x_workbench import summarize_tables

          out = []
          for name in [
              "EVIDENCE/237103ZM1E.dat", "EVIDENCE/237103ZM2E.dat",
              "EVIDENCE/237103ZM3A.dat", "EVIDENCE/237103ZM4A.dat",
          ]:
              raw = Path(name).read_bytes()
              rom = load_any_rom(Path(name))
              out.append(chr(10) + "===== " + name + " =====")
              out.append("container_size=%d decoded_size=%d" % (len(raw), len(rom)))
              pos = raw.find(bytes((0x80,0x15,0xFC)), 0, 0x200)
              out.append("first_frame_offset=%s" % (hex(pos) if pos >= 0 else "not_found"))
              if pos < 0: pos = 0x43
              recs = []
              errors = []
              while pos + 11 <= len(raw) and raw[pos:pos+2] == bytes((0x80,0x15)):
                  kwp_len = raw[pos+3]
                  frame_len = 4 + kwp_len + 1
                  if pos + frame_len > len(raw):
                      errors.append("truncated@" + hex(pos)); break
                  blk = raw[pos:pos+frame_len]
                  if (sum(blk[:-1]) & 0xff) != blk[-1]:
                      errors.append("checksum@" + hex(pos)); break
                  if blk[4:6] != bytes((0x34,0x82)):
                      errors.append("command@" + hex(pos) + ":" + blk[4:6].hex()); break
                  addr = int.from_bytes(blk[6:9], "big")
                  plen = blk[9]
                  if 10 + plen > frame_len - 1:
                      errors.append("payload_len@" + hex(pos)); break
                  recs.append((addr, plen, pos))
                  pos += frame_len
              out.append("frames=%d min_addr=%s max_exclusive=%s errors=%r" % (
                  len(recs), hex(min((a for a,n,p in recs), default=0)),
                  hex(max((a+n for a,n,p in recs), default=0)), errors))
              out.append("first_records=%r" % recs[:8])
              out.append("last_records=%r" % recs[-8:])
              for lo in (0,0x80000,0x100000,0x180000):
                  hi = min(lo+0x80000,len(rom))
                  if lo >= hi: continue
                  seg=rom[lo:hi]
                  out.append("bank_%06X_%06X non_ff=%d unique=%d head=%s" % (
                      lo,hi,sum(b!=0xff for b in seg),len(set(seg)),seg[:16].hex()))
              out.append("cpu_tags=%r" % sorted(set(x.decode() for x in re.findall(rb"SH70[0-9A-Z]{2,6}",rom))))
              out.append("fid_like=%r" % sorted(set(x.decode() for x in re.findall(rb"[0-9][A-Z0-9]{7}",rom)))[:40])
              for base in (0,0x80000,0x100000,0x180000):
                  if base >= len(rom): continue
                  hi=min(base+0x80000,len(rom))
                  helpers=discover_helpers(rom,search_lo=base+0x4000,search_hi=hi)
                  calls=extract_calls(rom,helpers,code_start=min(base+0x2000,len(rom)-2)) if helpers else []
                  tables=summarize_tables(rom,calls) if calls else {}
                  out.append("helper_window_%06X helpers=%d calls=%d resolved=%d tables=%d" % (
                      base,len(helpers),len(calls),sum(c.get("table") is not None for c in calls),len(tables)))
          for name in ["EVIDENCE/E1BR20E.dat","EVIDENCE/8201032726.dat"]:
              raw=Path(name).read_bytes()
              out.append(chr(10)+"===== RAW "+name+" =====")
              out.append("size=%d marker_count=%d head_hex=%s" % (
                  len(raw),raw.count(bytes((0x80,0x15))),raw[:128].hex()))
              out.append("head_ascii=%r" % re.sub(rb"[^ -~]",b".",raw[:180]))
          Path("donor-scan/FORMAT_DIAGNOSTICS.txt").write_text(chr(10).join(out)+chr(10),encoding="utf-8")
          print(chr(10).join(out))
          PY
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el19a-dat-layout-diagnostic
          path: donor-scan/
          if-no-files-found: error
          retention-days: 14
