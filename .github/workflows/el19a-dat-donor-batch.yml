name: EL19A One-shot CONSULT Donor Batch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/el19a-dat-donor-batch.yml"

permissions:
  contents: read

jobs:
  donor-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan ten new candidates and three controls
        shell: bash
        run: |
          set -u
          mkdir -p donor-scan/scans donor-scan/diffs
          files=(
            "EVIDENCE/23710EM62B.dat"
            "EVIDENCE/23710EM64A.dat"
            "EVIDENCE/23710EM60B.dat"
            "EVIDENCE/23710EM67A.dat"
            "EVIDENCE/237103ZM3A.dat"
            "EVIDENCE/237103ZM1E.dat"
            "EVIDENCE/237103ZM4A.dat"
            "EVIDENCE/237103ZM2E.dat"
            "EVIDENCE/E1BR20E.dat"
            "EVIDENCE/8201032726.dat"
            "EVIDENCE/unknown_EM62B_SH7055.bin"
            "EVIDENCE/237108W94B.dat"
            "EVIDENCE/VERSA f501.bin"
          )
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            stem="${name%.*}"
            echo "===== SCAN $f ====="
            set +e
            python3 tools/nissan_sh705x_workbench.py scan "$f" \
              --json "donor-scan/scans/$stem.json" \
              --tsv "donor-scan/scans/$stem.tsv" \
              > "donor-scan/scans/$stem.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "donor-scan/scans/$stem.exit"
            cat "donor-scan/scans/$stem.log"
            echo "EXIT_CODE=$rc"
          done

      - name: Compare candidate firmware families and target
        shell: bash
        run: |
          set -u
          run_diff() {
            a="$1"
            b="$2"
            slug="$(basename "${a%.*}")__VS__$(basename "${b%.*}")"
            echo "===== DIFF $a vs $b ====="
            set +e
            python3 tools/nissan_sh705x_workbench.py diff "$a" "$b" --raw-limit 12 \
              > "donor-scan/diffs/$slug.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "donor-scan/diffs/$slug.exit"
            cat "donor-scan/diffs/$slug.log"
            echo "EXIT_CODE=$rc"
          }
          run_diff "EVIDENCE/23710EM62B.dat" "EVIDENCE/unknown_EM62B_SH7055.bin"
          run_diff "EVIDENCE/23710EM60B.dat" "EVIDENCE/23710EM62B.dat"
          run_diff "EVIDENCE/23710EM64A.dat" "EVIDENCE/23710EM62B.dat"
          run_diff "EVIDENCE/23710EM67A.dat" "EVIDENCE/23710EM64A.dat"
          run_diff "EVIDENCE/23710EM62B.dat" "EVIDENCE/237108W94B.dat"
          run_diff "EVIDENCE/237103ZM3A.dat" "EVIDENCE/VERSA f501.bin"
          run_diff "EVIDENCE/237103ZM1E.dat" "EVIDENCE/VERSA f501.bin"
          run_diff "EVIDENCE/237103ZM4A.dat" "EVIDENCE/237103ZM3A.dat"
          run_diff "EVIDENCE/237103ZM2E.dat" "EVIDENCE/237103ZM1E.dat"
          run_diff "EVIDENCE/E1BR20E.dat" "EVIDENCE/VERSA f501.bin"
          run_diff "EVIDENCE/8201032726.dat" "EVIDENCE/VERSA f501.bin"

      - name: Build compact scan summary and input hashes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, os
          out = []
          for path in sorted(glob.glob("donor-scan/scans/*.json")):
              try:
                  d = json.load(open(path, encoding="utf-8"))
                  fp = d.get("fingerprint", {})
                  stem = os.path.basename(path)
                  logp = path[:-5] + ".log"
                  log = open(logp, encoding="utf-8", errors="replace").read() if os.path.exists(logp) else ""
                  call_line = next((x.strip() for x in log.splitlines() if x.startswith("Call sites:")), "Call sites: unavailable")
                  out.append("%s | size=%s | MD5=%s | SHA256=%s | CPU=%s | FID=%s | helpers=%d | tables=%d | %s" % (
                      stem, fp.get("size"), fp.get("md5"), fp.get("sha256"),
                      ",".join(fp.get("cpu_tags", [])), ",".join(fp.get("fid_tags", [])),
                      len(d.get("helpers", {})), len(d.get("tables", {})), call_line))
              except Exception as e:
                  out.append(os.path.basename(path) + " | SUMMARY_ERROR=" + repr(e))
          with open("donor-scan/SUMMARY.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          print("\n".join(out))
          PY
          sha256sum \
            "EVIDENCE/23710EM62B.dat" "EVIDENCE/23710EM64A.dat" \
            "EVIDENCE/23710EM60B.dat" "EVIDENCE/23710EM67A.dat" \
            "EVIDENCE/237103ZM3A.dat" "EVIDENCE/237103ZM1E.dat" \
            "EVIDENCE/237103ZM4A.dat" "EVIDENCE/237103ZM2E.dat" \
            "EVIDENCE/E1BR20E.dat" "EVIDENCE/8201032726.dat" \
            > donor-scan/INPUT_SHA256.txt

      - name: Upload scan and diff outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el19a-dat-donor-batch
          path: donor-scan/
          if-no-files-found: error
          retention-days: 14
