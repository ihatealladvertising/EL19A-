name: Temporary V6 donor evidence publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-publish-evidence.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout locked integration branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified current workbench exports
        uses: actions/download-artifact@v4
        with:
          name: v6-first-class-donor
          run-id: 46028977924
          github-token: ${{ github.token }}
          path: current-output

      - name: Download verified 306-candidate reconciliation
        uses: actions/download-artifact@v4
        with:
          name: v6-first-class-donor-reconciled
          run-id: 46030473101
          github-token: ${{ github.token }}
          path: reconciled-output

      - name: Build durable compressed evidence archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, hashlib, json, shutil
          from pathlib import Path

          CUR = Path("current-output")
          REC = Path("reconciled-output")
          DEST = Path("EVIDENCE/V6_FIRST_CLASS_DONOR_2026-11-27")
          DEST.mkdir(parents=True, exist_ok=True)

          summary = json.loads((REC / "summary.json").read_text(encoding="utf-8"))
          comparison = json.loads((REC / "el19a_v6_payload_comparison_306.json").read_text(encoding="utf-8"))
          index_path = REC / "sh705x_reference_index_151_roms_v6_306_candidates_plus_a2l.json"
          index_sha = hashlib.sha256(index_path.read_bytes()).hexdigest()

          assert summary["status"] == "COMPLETE"
          assert summary["legacy_scan"]["helper_count"] == 36
          assert summary["legacy_scan"]["call_count"] == 413
          assert summary["legacy_scan"]["resolved_call_count"] == 391
          assert summary["legacy_scan"]["table_count"] == 306
          assert summary["current_scan"]["helper_count"] == 36
          assert summary["current_scan"]["call_count"] == 408
          assert summary["current_scan"]["resolved_call_count"] == 386
          assert summary["current_scan"]["table_count"] == 302
          assert summary["candidate_set_reconciliation"]["union_candidates"] == 306
          assert summary["candidate_set_reconciliation"]["historical_only_count"] == 4
          assert summary["candidate_set_reconciliation"]["strict_current_only_count"] == 0
          assert summary["a2l_pairing_status"] == "PROVISIONAL_UNVERIFIED"
          assert summary["expanded_reference_index"]["sha256"] == index_sha
          assert comparison["exact_payload_match_pair_count"] == 832
          assert comparison["same_geometry_differing_payload_pair_count"] == 15290
          assert summary["el19a_comparison"]["v6_crossref_target_candidate_count"] == 124

          legacy_cat = json.loads((REC / "v6_legacy_306.catalogue.json").read_text(encoding="utf-8"))
          assert len(legacy_cat["candidates"]) == 306
          assert len(legacy_cat["observations"]) == 413
          assert len(legacy_cat["helpers"]) == 36
          with (REC / "v6_legacy_306.per_address.tsv").open(encoding="utf-8") as f:
              assert sum(1 for _ in csv.DictReader(f, delimiter="\t")) == 306
          with (REC / "v6_legacy_306.per_call_tsv/64810223F121200000_9d5efbd9.calls.tsv").open(encoding="utf-8") as f:
              assert sum(1 for _ in csv.DictReader(f, delimiter="\t")) == 413

          files = [
              (REC / "sh705x_reference_index_151_roms_v6_306_candidates_plus_a2l.json", "reference_index_151rom_v6_306_plus_provisional_a2l.json.gz", "Complete merged cross-ROM reference index"),
              (REC / "v6_legacy_306.catalogue.json", "v6_historical_306_per_address_catalogue.json.gz", "306-address catalogue with 413 call observations, 36 helpers and axes"),
              (REC / "v6_legacy_306.per_call.json", "v6_historical_413_per_call_export.json.gz", "Historical scanner complete per-call JSON"),
              (REC / "v6_legacy_306.per_address.tsv", "v6_historical_306_per_address.tsv.gz", "Historical scanner per-address TSV"),
              (REC / "v6_candidate_reconciliation.json", "v6_historical_vs_current_reconciliation.json.gz", "Exact call-PC and table-address reconciliation"),
              (REC / "el19a_v6_payload_comparison_306.json", "el19a_v6_exact_and_same_geometry_comparison.json.gz", "Deduplicated exact and same-geometry comparison matrix"),
              (REC / "el19a_v6_payload_comparison_306.tsv", "el19a_v6_exact_and_same_geometry_comparison.tsv.gz", "Deduplicated comparison rows"),
              (REC / "el19a_v6_provisional_crossref_306.json", "el19a_v6_provisional_crossref.json.gz", "V6 donor leads at EL19A addresses"),
              (CUR / "scans/v6.catalogue.json", "v6_current_strict_302_catalogue.json.gz", "Current strict scanner per-address catalogue"),
              (CUR / "v6.per_call.json", "v6_current_strict_408_per_call_export.json.gz", "Current strict scanner per-call JSON"),
              (CUR / "v6.per_address.tsv", "v6_current_strict_302_per_address.tsv.gz", "Current strict scanner per-address TSV"),
              (CUR / "v6.per_call_tsv/64810223F121200000_9d5efbd9.calls.tsv", "v6_current_strict_408_calls.tsv.gz", "Current strict scanner per-call TSV"),
              (CUR / "v6.per_call_tsv/64810223F121200000_9d5efbd9.tables.tsv", "v6_current_strict_302_tables.tsv.gz", "Current strict scanner per-table TSV"),
              (CUR / "v6.per_call_tsv/64810223F121200000_9d5efbd9.helpers.tsv", "v6_current_strict_36_helpers.tsv.gz", "Current strict scanner helper TSV"),
              (CUR / "el19a.per_call.json", "el19a_current_377_per_call_export.json.gz", "EL19A comparison target per-call export"),
              (CUR / "el19a.per_address.tsv", "el19a_current_291_per_address.tsv.gz", "EL19A comparison target per-address TSV"),
              (CUR / "scans/el19a.catalogue.json", "el19a_current_291_catalogue.json.gz", "EL19A comparison target catalogue"),
              (CUR / "workbench_el19a_vs_v6_diff.json", "el19a_v6_workbench_diff.json.gz", "Official current-workbench donor diff"),
          ]

          def sha256(path):
              h = hashlib.sha256()
              with Path(path).open("rb") as f:
                  for b in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(b)
              return h.hexdigest()

          entries = []
          for src, name, role in files:
              if not src.is_file():
                  raise FileNotFoundError(src)
              dst = DEST / name
              with src.open("rb") as fin, dst.open("wb") as raw:
                  with gzip.GzipFile(filename="", mode="wb", compresslevel=9, fileobj=raw, mtime=0) as gz:
                      shutil.copyfileobj(fin, gz)
              entries.append({
                  "path": str(dst),
                  "role": role,
                  "source_path": str(src),
                  "source_size_bytes": src.stat().st_size,
                  "source_sha256": sha256(src),
                  "compressed_size_bytes": dst.stat().st_size,
                  "compressed_sha256": sha256(dst),
              })

          idx = json.loads(index_path.read_text(encoding="utf-8"))
          v6 = next(x for x in idx["sources"]["donor_roms"] if x.get("path", "").endswith("64810223F121200000.hex"))
          hist = summary["legacy_scan"]
          strict = summary["current_scan"]
          aset = summary["candidate_set_reconciliation"]
          cmp = comparison
          cmp_summary = summary["el19a_comparison"]
          readme = [
              "# V6 first-class donor — 2026-11-27",
              "",
              "## Result",
              "",
              "V6 is now a first-class SH705x cross-ROM donor. The earlier 306-table result was reproduced using the historical scanner revision against the exact same decoded ROM, reconciled against the current strict scanner, and retained in the expanded 151-ROM reference index.",
              "",
              "| Measure | Historical scanner | Current strict scanner |",
              "|---|---:|---:|",
              f"| Helpers | {hist['helper_count']} | {strict['helper_count']} |",
              f"| Calls | {hist['call_count']} | {strict['call_count']} |",
              f"| Resolved calls | {hist['resolved_call_count']} | {strict['resolved_call_count']} |",
              f"| Unique table bases | {hist['table_count']} | {strict['table_count']} |",
              "",
              "All 302 current strict candidates occur in the historical set. Four historical candidates are not re-emitted by the stricter current scanner: **0x0CE32, 0x0DACE, 0x0E57A and 0x10528**. Five historical call sites are absent from the current set: **0x44946, 0x45F04, 0x4C93A, 0x4EBBA and 0x7D52C**. The four additional candidate addresses are retained as historical-only donor leads, not promoted to current strict resolutions.",
              "",
              "## EL19A comparison (306-candidate union)",
              "",
              f"- Exact payload matches: **{cmp['exact_payload_match_pair_count']} candidate pairs**, covering **{cmp['el19a_candidates_with_exact_v6_payload']} EL19A addresses** and **{cmp['unique_v6_candidates_with_exact_payload']} V6 addresses**.",
              f"- Same-geometry, different-payload comparisons: **{cmp['same_geometry_differing_payload_pair_count']} pairs**, covering **{cmp['el19a_candidates_with_same_geometry_differences']} EL19A addresses** and **{cmp['unique_v6_candidates_with_same_geometry_differences']} V6 addresses**.",
              "- Geometry is defined by element type, dimensions and byte length. Helper-kind differences remain metadata. Identical payload/geometry variants emitted by both scanner versions are counted once.",
              f"- Canonical matcher: **{cmp_summary['v6_crossref_target_candidate_count']} EL19A candidate addresses** with V6 donor cross-reference hits.",
              "",
              "These are structural donor relationships only. They do not establish semantic identity, units, conversion, calibration correctness or an EL19A target-table definition.",
              "",
              "## A2L boundary",
              "",
              f"The candidate A2L file is EVIDENCE/side project/64811000p2_m.a2l (SHA-256 {v6['a2l_source_sha256']}). Its ROM pairing remains **PROVISIONAL_UNVERIFIED** under WO65212. Same-address symbol overlap is recorded only as a provisional association; it is not independent proof that this A2L belongs to this HEX. No A2L names or semantics are treated as confirmed V6/EL19A truth.",
              "",
              "## Source identity and index",
              "",
              "- V6 input: EVIDENCE/side project/64810223F121200000.hex",
              f"- V6 container SHA-256: {v6['container_sha256']}",
              f"- Decoded 1 MiB ROM SHA-256: {v6['decoded_rom_sha256']}",
              f"- FID / CPU: {v6['fid']} / SH705822N",
              "- Expanded reference index: 151 ROMs, 7 XML documents, 1 provisional A2L.",
              f"- Expanded raw JSON index SHA-256: {index_sha}",
              f"- Historical scanner revision: {summary['historical_scanner_commit']}",
              f"- Current scanner source SHA-256: {strict['source_sha256']}",
              "- Prior 150-ROM index reused without rescanning those ROMs; its raw SHA-256 was 2daba4660c89a1b2a09f51f322645d04463c20c7c2c7fee95acd0817e81f57cf.",
              "",
              "## Correction",
              "",
              "WO70019's zero-helper/zero-match V6 row was an input-classification error: the Intel HEX ROM was treated as an A2L source. It is superseded for this V6 input by this verified ROM scan and reconciliation.",
              "",
              "## Preserved exports",
              "",
              "All catalogue, per-call, per-address, full-index and comparison exports are stored beside this report as deterministic gzip files. manifest.json records raw and compressed sizes and SHA-256 digests for every file. Decompress a .gz file with standard gzip-compatible software before opening it.",
              "",
              "Source artifacts: successful current-workbench run 46028977924 and successful deduplicated reconciliation run 46030473101 (artifact 15214012314; SHA-256 5da5b77cdafe8cf450cf52cc1b9f4471ecdae81a56ee88fb35c0147d272ca591).",
              ""
          ]
          (DEST / "README.md").write_text("\n".join(readme), encoding="utf-8")

          manifest = {
              "schema": "v6-first-class-donor-evidence-bundle-v1",
              "created_utc": "2026-11-27",
              "source_runs": {
                  "current_workbench_run_id": 46028977924,
                  "reconciliation_run_id": 46030473101,
                  "reconciliation_artifact_id": 15214012314,
                  "reconciliation_artifact_sha256": "5da5b77cdafe8cf450cf52cc1b9f4471ecdae81a56ee88fb35c0147d272ca591"
              },
              "v6_identity": {
                  "path": str(v6["path"]),
                  "container_sha256": v6["container_sha256"],
                  "decoded_rom_sha256": v6["decoded_rom_sha256"],
                  "fid": v6["fid"],
                  "rom_id": v6["rom_id"]
              },
              "historical_vs_current": summary,
              "expanded_index_raw_sha256": index_sha,
              "a2l_pairing_status": "PROVISIONAL_UNVERIFIED",
              "files": entries
          }
          (DEST / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "status": "READY_TO_COMMIT",
              "file_count": len(entries) + 2,
              "total_compressed_bytes": sum(x["compressed_size_bytes"] for x in entries),
              "index_sha256": index_sha,
              "historical_candidates": hist["table_count"],
              "strict_current_candidates": strict["table_count"],
              "exact_pairs": cmp["exact_payload_match_pair_count"],
              "same_geometry_differences": cmp["same_geometry_differing_payload_pair_count"]
          }, indent=2))
          PY

      - name: Commit durable V6 evidence bundle to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf current-output reconciled-output
          git add EVIDENCE/V6_FIRST_CLASS_DONOR_2026-11-27
          git commit -m "Add V6 first-class donor index and scan evidence"
          git stash push --include-untracked -m "Preserve unrelated pre-existing Actions workspace changes"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --abort >/dev/null 2>&1 || true
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Could not publish evidence after three fast-forward retries" >&2
          exit 1
