name: SH705x Scanner & Workbench Regression Tests

on:
  push:
    branches: [main]
    paths:
      - "tools/sh7058_cross_rom_scanner.py"
      - "tools/test_sh7058_cross_rom_scanner.py"
      - "tools/sh705x_rom_loader.py"
      - "tools/nissan_sh705x_workbench.py"
      - "tools/test_nissan_sh705x_workbench.py"
      - "tools/sh705x_discovery_v2.py"
      - "tools/test_sh705x_discovery_v2.py"
      - "tools/romraider_ref_index.py"
      - "tools/test_romraider_ref_index.py"
      - "tools/romraider_xml_export.py"
      - "tools/test_romraider_xml_export.py"
      - "tools/nissan_rom_family_index.py"
      - "tools/run_nissan_rom_family_index.py"
      - "tools/test_nissan_rom_family_index.py"
      - "tools/reader_trace_graph.py"
      - "tools/test_reader_trace_graph.py"
      - "tools/reader_trace_indexer_adapter.py"
      - "tools/test_reader_trace_indexer_adapter.py"
      - "tools/rom_access_indexer.py"
      - "tools/build_static_indices.py"
      - "tools/test_rom_access_indexer.py"
      - "tools/test_reader_trace_static_flow.py"
      - "tools/reader_trace_helper_profiles.py"
      - "tools/test_reader_trace_helper_profiles.py"
      - "EVIDENCE/READER_TRACE_V0_1/**"
      - "CONTROL/SH705X_READER_TRACE_GRAPH_SCHEMA.md"
      - ".github/workflows/sh7058-scanner-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/sh7058_cross_rom_scanner.py"
      - "tools/test_sh7058_cross_rom_scanner.py"
      - "tools/sh705x_rom_loader.py"
      - "tools/nissan_sh705x_workbench.py"
      - "tools/test_nissan_sh705x_workbench.py"
      - "tools/sh705x_discovery_v2.py"
      - "tools/test_sh705x_discovery_v2.py"
      - "tools/romraider_ref_index.py"
      - "tools/test_romraider_ref_index.py"
      - "tools/romraider_xml_export.py"
      - "tools/test_romraider_xml_export.py"
      - "tools/nissan_rom_family_index.py"
      - "tools/run_nissan_rom_family_index.py"
      - "tools/test_nissan_rom_family_index.py"
      - "tools/reader_trace_graph.py"
      - "tools/test_reader_trace_graph.py"
      - "tools/reader_trace_indexer_adapter.py"
      - "tools/test_reader_trace_indexer_adapter.py"
      - "tools/rom_access_indexer.py"
      - "tools/build_static_indices.py"
      - "tools/test_rom_access_indexer.py"
      - "tools/test_reader_trace_static_flow.py"
      - "tools/reader_trace_helper_profiles.py"
      - "tools/test_reader_trace_helper_profiles.py"
      - "EVIDENCE/READER_TRACE_V0_1/**"
      - "CONTROL/SH705X_READER_TRACE_GRAPH_SCHEMA.md"
      - ".github/workflows/sh7058-scanner-tests.yml"

permissions:
  contents: read

jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scanner, workbench, discovery v2, ref index, xml export, and synthetic tests
        run: >
          python3 -m py_compile
          tools/sh7058_cross_rom_scanner.py
          tools/test_sh7058_cross_rom_scanner.py
          tools/sh705x_rom_loader.py
          tools/nissan_sh705x_workbench.py
          tools/test_nissan_sh705x_workbench.py
          tools/sh705x_discovery_v2.py
          tools/test_sh705x_discovery_v2.py
          tools/romraider_ref_index.py
          tools/test_romraider_ref_index.py
          tools/romraider_xml_export.py
          tools/test_romraider_xml_export.py
          tools/nissan_rom_family_index.py
          tools/run_nissan_rom_family_index.py
          tools/test_nissan_rom_family_index.py
          tools/reader_trace_graph.py
          tools/test_reader_trace_graph.py
          tools/test_reader_trace_indexer_adapter.py
          tools/reader_trace_indexer_adapter.py
          tools/rom_access_indexer.py
          tools/build_static_indices.py
          tools/test_rom_access_indexer.py
          tools/test_reader_trace_static_flow.py
          tools/reader_trace_helper_profiles.py
          tools/test_reader_trace_helper_profiles.py
      - name: Run synthetic regression tests (no real ROMs)
        run: >
          python3 -m unittest -v
          tools/test_sh7058_cross_rom_scanner.py
          tools/test_nissan_sh705x_workbench.py
          tools/test_sh705x_discovery_v2.py
          tools/test_romraider_ref_index.py
          tools/test_romraider_xml_export.py
          tools/test_nissan_rom_family_index.py
          tools/test_reader_trace_graph.py
          tools/test_reader_trace_indexer_adapter.py
          tools/test_reader_trace_static_flow.py
          tools/test_reader_trace_helper_profiles.py
          tools/test_rom_access_indexer.py
