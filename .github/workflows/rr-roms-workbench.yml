name: Temporary RR ROMs workbench batch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rr-roms-workbench.yml"

permissions:
  contents: read

jobs:
  rr-roms-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout workbench and RR ROM evidence only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            EVIDENCE/rr roms
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile workbench modules
        run: |
          python -m py_compile tools/nissan_sh705x_workbench.py tools/sh705x_rom_loader.py tools/sh7058_cross_rom_scanner.py tools/sh705x_discovery_v2.py tools/romraider_ref_index.py
          python --version
          git rev-parse HEAD

      - name: Run workbench scans and build the RomRaider reference index
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json, re, subprocess, sys, time, traceback
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path("EVIDENCE/rr roms")
          out = Path("workbench-output")
          scans = out / "scans"
          logs = out / "logs"
          scans.mkdir(parents=True, exist_ok=True)
          logs.mkdir(parents=True, exist_ok=True)
          supported = {".bin", ".zip", ".s19", ".hex", ".dat"}
          paths = sorted(p for p in root.iterdir() if p.is_file())
          records = []
          by_container_sha = {}
          successful = []
          start = time.time()

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def slug(name):
              base = re.sub(r"[^A-Za-z0-9._-]+", "_", name).strip("._")
              return (base[:70] or "rom")

          xml_paths = [str(p) for p in paths if p.suffix.lower() == ".xml"]
          print("FOLDER FILE COUNT:", len(paths))
          print("XML DEFINITION INPUTS:", len(xml_paths))

          for n, p in enumerate(paths, 1):
              size = p.stat().st_size
              digest = sha256(p)
              rec = {"path": str(p), "filename": p.name, "bytes": size, "container_sha256": digest}
              if p.suffix.lower() not in supported:
                  rec["status"] = "SKIPPED_UNSUPPORTED_EXTENSION"
                  rec["extension"] = p.suffix.lower() or "(none)"
                  records.append(rec)
                  print(f"[{n}/{len(paths)}] SKIP {p.name}: unsupported extension {p.suffix.lower() or '(none)'}")
                  continue
              if digest in by_container_sha:
                  rec["status"] = "EXACT_CONTAINER_DUPLICATE"
                  rec["duplicate_of"] = by_container_sha[digest]
                  records.append(rec)
                  print(f"[{n}/{len(paths)}] DUPLICATE {p.name} -> {rec['duplicate_of']}")
                  continue

              by_container_sha[digest] = str(p)
              stem = f"{digest[:12]}_{slug(p.name)}"
              out_tsv = scans / (stem + ".tables.tsv")
              out_json = scans / (stem + ".scan.json")
              out_cat = scans / (stem + ".catalogue.json")
              out_manifest = scans / (stem + ".manifest.json")
              cmd = [
                  sys.executable, "tools/nissan_sh705x_workbench.py", "scan", str(p),
                  "--tsv", str(out_tsv), "--json", str(out_json),
                  "--catalogue", str(out_cat), "--manifest", str(out_manifest)
              ]
              print(f"[{n}/{len(paths)}] SCAN {p.name} ({size} bytes)")
              try:
                  proc = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                  (logs / (stem + ".stdout.txt")).write_text(proc.stdout, encoding="utf-8")
                  (logs / (stem + ".stderr.txt")).write_text(proc.stderr, encoding="utf-8")
                  rec["exit_code"] = proc.returncode
                  rec["status"] = "SCAN_OK" if proc.returncode == 0 else "SCAN_FAILED"
                  rec["stdout_log"] = str(logs / (stem + ".stdout.txt"))
                  rec["stderr_log"] = str(logs / (stem + ".stderr.txt"))
                  if proc.returncode == 0:
                      successful.append(str(p))
                  if out_json.exists():
                      payload = json.loads(out_json.read_text(encoding="utf-8"))
                      fp = payload.get("fingerprint", {})
                      meta = fp.get("nissan_meta", {})
                      cks = fp.get("checksums", {})
                      rec["decoded_rom_sha256"] = fp.get("sha256")
                      rec["decoded_size"] = fp.get("size")
                      rec["cpu_tags"] = fp.get("cpu_tags")
                      rec["fid_tags"] = fp.get("fid_tags")
                      rec["loader"] = meta.get("loader")
                      rec["fid"] = meta.get("fid")
                      rec["fid_cpu"] = meta.get("fid_cpu")
                      rec["checksums"] = cks
                      rec["helper_count"] = len(payload.get("helpers", {}))
                      rec["table_count"] = len(payload.get("tables", {}))
                  call_m = re.search(r"Call sites: (\d+) total, (\d+) resolved -> (\d+) unique tables", proc.stdout)
                  if call_m:
                      rec["call_sites"] = int(call_m.group(1))
                      rec["resolved_calls"] = int(call_m.group(2))
                      rec["unique_tables"] = int(call_m.group(3))
                  rec["outputs"] = {k: str(v) for k, v in {
                      "tsv": out_tsv, "json": out_json, "catalogue": out_cat, "manifest": out_manifest
                  }.items() if v.exists()}
                  if proc.returncode != 0:
                      rec["error_excerpt"] = (proc.stderr or proc.stdout)[-3000:]
              except subprocess.TimeoutExpired as exc:
                  rec["status"] = "SCAN_TIMEOUT"
                  rec["error_excerpt"] = str(exc)
              except Exception as exc:
                  rec["status"] = "SCAN_RUNNER_ERROR"
                  rec["error_excerpt"] = repr(exc)
              records.append(rec)

          # Build multi-source reference index from successful unique ROM containers + all seven XML sources.
          ref_record = {"status": "NOT_RUN", "rom_inputs": len(successful), "xml_inputs": len(xml_paths)}
          if successful and xml_paths:
              ref_path = out / "rr_roms_reference_index.json"
              cmd = [sys.executable, "tools/nissan_sh705x_workbench.py", "ref-index", "build",
                     "--out", str(ref_path), "--xml"] + xml_paths + ["--rom"] + successful
              print(f"BUILD REF INDEX: {len(successful)} ROMs + {len(xml_paths)} XML files")
              try:
                  proc = subprocess.run(cmd, capture_output=True, text=True, timeout=3600)
                  (logs / "ref-index.stdout.txt").write_text(proc.stdout, encoding="utf-8")
                  (logs / "ref-index.stderr.txt").write_text(proc.stderr, encoding="utf-8")
                  ref_record.update({"exit_code": proc.returncode, "status": "OK" if proc.returncode == 0 else "FAILED",
                                     "stdout_log": str(logs / "ref-index.stdout.txt"),
                                     "stderr_log": str(logs / "ref-index.stderr.txt")})
                  if ref_path.exists():
                      idx = json.loads(ref_path.read_text(encoding="utf-8"))
                      ref_record["index_sha256"] = sha256(ref_path)
                      ref_record["indexed_roms"] = len(idx.get("sources", {}).get("donor_roms", []))
                      ref_record["xml_documents"] = len(idx.get("sources", {}).get("xml_documents", []))
                      ref_record["xml_symbol_addresses"] = len(idx.get("lookups", {}).get("xml_by_addr", {}))
                      ref_record["payload_hash_keys"] = len(idx.get("lookups", {}).get("payload_index", {}))
              except subprocess.TimeoutExpired as exc:
                  ref_record.update({"status": "TIMEOUT", "error": str(exc)})
              except Exception as exc:
                  ref_record.update({"status": "RUNNER_ERROR", "error": repr(exc), "traceback": traceback.format_exc()})

          # Mark decoded-byte duplicates, retaining every source path.
          decoded = defaultdict(list)
          for rec in records:
              if rec.get("decoded_rom_sha256") and rec.get("status") == "SCAN_OK":
                  decoded[rec["decoded_rom_sha256"]].append(rec["path"])
          for rec in records:
              if rec.get("decoded_rom_sha256"):
                  group = decoded[rec["decoded_rom_sha256"]]
                  rec["decoded_duplicate_count"] = len(group)
                  if len(group) > 1:
                      rec["decoded_duplicate_paths"] = group

          status_counts = Counter(r["status"] for r in records)
          summary = {
              "schema": "rr-roms-workbench-batch-v1",
              "repo_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": sys.version,
              "tool_hashes": {str(p): sha256(p) for p in [
                  Path("tools/nissan_sh705x_workbench.py"), Path("tools/sh705x_rom_loader.py"),
                  Path("tools/sh7058_cross_rom_scanner.py"), Path("tools/sh705x_discovery_v2.py"),
                  Path("tools/romraider_ref_index.py")
              ]},
              "folder_count": len(paths),
              "status_counts": dict(status_counts),
              "unique_container_hashes_scanned": len(successful),
              "decoded_rom_hash_groups": len(decoded),
              "decoded_duplicate_groups": sum(1 for g in decoded.values() if len(g) > 1),
              "ref_index": ref_record,
              "elapsed_seconds": round(time.time() - start, 3),
              "records": records
          }
          summary_path = out / "rr_roms_batch_summary.json"
          summary_path.write_text(json.dumps(summary, indent=2), encoding="utf-8")
          with (out / "rr_roms_inventory.tsv").open("w", encoding="utf-8", newline="") as f:
              cols = sorted({k for r in records for k in r if not isinstance(r.get(k), (dict, list))})
              w = csv.DictWriter(f, fieldnames=cols, delimiter="\t", extrasaction="ignore")
              w.writeheader()
              for r in records:
                  row = {k: (json.dumps(v, sort_keys=True) if isinstance(v, (dict, list)) else v) for k, v in r.items()}
                  w.writerow(row)
          print("FINAL STATUS COUNTS:", dict(status_counts))
          print("SUCCESSFUL ROM CONTAINERS:", len(successful))
          print("DECODED ROM HASH GROUPS:", len(decoded))
          print("REFERENCE INDEX:", json.dumps(ref_record, sort_keys=True))
          print("SUMMARY:", summary_path)
          PY

      - name: Upload full workbench evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-roms-workbench-batch
          path: workbench-output/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
