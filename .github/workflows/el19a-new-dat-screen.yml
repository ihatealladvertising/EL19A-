name: EL19A New CONSULT DAT Screen

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/el19a-new-dat-screen.yml"

permissions:
  contents: read

jobs:
  dat-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan newly added DAT files
        shell: bash
        run: |
          mkdir -p dat-screen/scans dat-screen/diffs
          files=(
            "EVIDENCE/23710EM61B.dat"
            "EVIDENCE/23710EM63B.dat"
            "EVIDENCE/23710EM65A.dat"
            "EVIDENCE/23710EM66A.dat"
            "EVIDENCE/310364EM1C.dat"
            "EVIDENCE/310364EP1B.dat"
            "EVIDENCE/e1bc11b.dat"
            "EVIDENCE/e1bc12b.dat"
          )
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            stem="${name%.*}"
            echo "===== SCAN $f ====="
            set +e
            python3 tools/nissan_sh705x_workbench.py scan "$f" \
              --json "dat-screen/scans/$stem.json" \
              --tsv "dat-screen/scans/$stem.tsv" \
              > "dat-screen/scans/$stem.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "dat-screen/scans/$stem.exit"
            cat "dat-screen/scans/$stem.log"
            echo "EXIT_CODE=$rc"
          done
      - name: Compare within the EM revision sequences and new formats
        shell: bash
        run: |
          mkdir -p dat-screen/diffs
          run_diff() {
            a="$1"; b="$2"
            slug="$(basename "${a%.*}")__VS__$(basename "${b%.*}")"
            echo "===== DIFF $a vs $b ====="
            set +e
            python3 tools/nissan_sh705x_workbench.py diff "$a" "$b" --raw-limit 20 \
              > "dat-screen/diffs/$slug.log" 2>&1
            rc=$?
            set -e
            echo "$rc" > "dat-screen/diffs/$slug.exit"
            cat "dat-screen/diffs/$slug.log"
            echo "EXIT_CODE=$rc"
          }
          run_diff "EVIDENCE/23710EM61B.dat" "EVIDENCE/23710EM60B.dat"
          run_diff "EVIDENCE/23710EM63B.dat" "EVIDENCE/23710EM62B.dat"
          run_diff "EVIDENCE/23710EM65A.dat" "EVIDENCE/23710EM64A.dat"
          run_diff "EVIDENCE/23710EM66A.dat" "EVIDENCE/23710EM67A.dat"
          run_diff "EVIDENCE/310364EM1C.dat" "EVIDENCE/310364EP1B.dat"
          run_diff "EVIDENCE/e1bc11b.dat" "EVIDENCE/e1bc12b.dat"
      - name: Summarize scans and hash all inputs
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json, os
          lines=[]
          for p in sorted(glob.glob("dat-screen/scans/*.json")):
              try:
                  d=json.load(open(p,encoding="utf-8"))
                  fp=d.get("fingerprint",{})
                  stem=os.path.basename(p)
                  logp=p[:-5]+".log"
                  log=open(logp,encoding="utf-8",errors="replace").read() if os.path.exists(logp) else ""
                  call=next((x.strip() for x in log.splitlines() if x.startswith("Call sites:")),"Call sites: unavailable")
                  lines.append("%s | decoded=%s | cpu=%s | fid=%s | helpers=%d | tables=%d | %s" % (
                    stem,fp.get("size"),",".join(fp.get("cpu_tags",[])),
                    ",".join(fp.get("fid_tags",[])),len(d.get("helpers",{})),
                    len(d.get("tables",{})),call))
              except Exception as e:
                  lines.append(os.path.basename(p)+" | summary_error="+repr(e))
          with open("dat-screen/SUMMARY.txt","w",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
          sha256sum \
            "EVIDENCE/23710EM61B.dat" "EVIDENCE/23710EM63B.dat" \
            "EVIDENCE/23710EM65A.dat" "EVIDENCE/23710EM66A.dat" \
            "EVIDENCE/310364EM1C.dat" "EVIDENCE/310364EP1B.dat" \
            "EVIDENCE/e1bc11b.dat" "EVIDENCE/e1bc12b.dat" \
            > dat-screen/INPUT_SHA256.txt
      - name: Inspect unsupported DAT headers only
        shell: bash
        run: |
          mkdir -p dat-screen/headers
          python3 - <<'PY'
          import re
          from pathlib import Path
          names = [
              "EVIDENCE/310364EM1C.dat", "EVIDENCE/310364EP1B.dat",
              "EVIDENCE/e1bc11b.dat", "EVIDENCE/e1bc12b.dat",
          ]
          out=[]
          for name in names:
              raw=Path(name).read_bytes()
              out.append("\\n===== "+name+" =====")
              out.append("size=%d" % len(raw))
              out.append("head256_hex="+raw[:256].hex())
              out.append("head256_ascii=%r" % re.sub(rb"[^ -~]",b".",raw[:256]))
              out.append("strings_first_0x4000=%r" % [
                  x.decode("ascii","replace")
                  for x in re.findall(rb"[ -~]{6,}",raw[:0x4000])[:100]
              ])
              out.append("8015_marker_count=%d first_offsets=%r" % (
                  raw.count(bytes((0x80,0x15)),
                  [m.start() for m in re.finditer(bytes((0x80,0x15)),raw[:0x4000])][:20]))
          Path("dat-screen/headers/UNSUPPORTED_DAT_HEADERS.txt").write_text(
              "\\n".join(out)+"\\n",encoding="utf-8")
          print("\\n".join(out))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: el19a-new-dat-screen
          path: dat-screen/
          if-no-files-found: error
          retention-days: 14
