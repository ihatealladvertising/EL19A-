name: Temporary V6 first-class donor rescan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-first-class-donor.yml"

permissions:
  contents: read
  actions: read

jobs:
  v6-donor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout existing workbench and pinned inputs only
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tools
            CALIBRATIONS/EL19A_release1_conservative.xml
            EVIDENCE/VERSA f501.bin
            EVIDENCE/side project
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reuse the prior 150-ROM reference-index artifact
        uses: actions/download-artifact@v4
        with:
          name: rr-roms-workbench-refresh
          run-id: 46023911353
          github-token: ${{ github.token }}
          path: previous-artifact

      - name: Run current V6 and EL19A exports, merge donor index, and compare
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/nissan_sh705x_workbench.py tools/sh705x_rom_loader.py tools/sh7058_cross_rom_scanner.py tools/sh705x_discovery_v2.py tools/romraider_ref_index.py
          cat > /tmp/run_v6_first_class_donor.py <<'PY'
          import csv, hashlib, json, os, re, subprocess, sys, zipfile
          from collections import Counter, defaultdict
          from pathlib import Path

          ROOT = Path(".")
          OUT = Path("workbench-output")
          SCANS = OUT / "scans"
          LOGS = OUT / "logs"
          SCANS.mkdir(parents=True, exist_ok=True)
          LOGS.mkdir(parents=True, exist_ok=True)

          V6 = Path("EVIDENCE/side project/64810223F121200000.hex")
          A2L = Path("EVIDENCE/side project/64811000p2_m.a2l")
          EL = Path("EVIDENCE/VERSA f501.bin")
          BASE_ZIP = Path("previous-artifact/rr-roms-workbench-refresh.zip")
          BASE_INDEX_SHA256 = "2daba4660c89a1b2a09f51f322645d04463c20c7c2c7fee95acd0817e81f57cf"
          HISTORICAL = {
              "container_sha256": "8cf39f78efc67f6ae162386454c121fcc6be4771fd624150ca7c2b4102679c0a",
              "helper_count": 36,
              "call_count": 413,
              "resolved_call_count": 391,
              "table_count": 306,
          }
          PAIRING_STATUS = "PROVISIONAL_UNVERIFIED"
          PAIRING_BASIS = "Candidate file association only; independent V6 HEX-to-A2L pairing remains unverified under WO65212."

          def sha256_bytes(b):
              return hashlib.sha256(b).hexdigest()

          def sha256_file(p):
              h = hashlib.sha256()
              with Path(p).open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def write_json(path, obj):
              Path(path).write_text(json.dumps(obj, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def run_scan(label, rom_path):
              stem = label.lower()
              outputs = {
                  "tsv": SCANS / f"{stem}.tables.tsv",
                  "json": SCANS / f"{stem}.summary.json",
                  "catalogue": SCANS / f"{stem}.catalogue.json",
                  "manifest": SCANS / f"{stem}.manifest.json",
              }
              cmd = [
                  sys.executable, "tools/nissan_sh705x_workbench.py", "scan", str(rom_path),
                  "--tsv", str(outputs["tsv"]), "--json", str(outputs["json"]),
                  "--catalogue", str(outputs["catalogue"]), "--manifest", str(outputs["manifest"]),
              ]
              proc = subprocess.run(cmd, text=True, capture_output=True, timeout=1800)
              (LOGS / f"{stem}.scan.stdout.txt").write_text(proc.stdout, encoding="utf-8")
              (LOGS / f"{stem}.scan.stderr.txt").write_text(proc.stderr, encoding="utf-8")
              if proc.returncode != 0:
                  raise RuntimeError(f"{label} workbench scan failed ({proc.returncode}): {proc.stderr[-3000:]}")
              doc = json.loads(outputs["catalogue"].read_text(encoding="utf-8"))
              scan = doc["manifest"]
              return doc, outputs, proc.stdout

          def call_export(label, rom_path, catalogue):
              import nissan_sh705x_workbench as wb
              from sh7058_cross_rom_scanner import build_scan_export, discover_helpers, extract_calls, write_machine_exports
              rom = wb.load_any_rom(rom_path)
              helpers = discover_helpers(rom)
              calls = extract_calls(rom, helpers)
              scan_doc = build_scan_export(str(rom_path), rom, helpers, calls)
              prefix = label.lower()
              tsv_dir = OUT / f"{prefix}.per_call_tsv"
              machine_json = OUT / f"{prefix}.per_call.json"
              write_machine_exports(machine_json, tsv_dir, [scan_doc])
              if len(scan_doc.get("helpers", [])) != len(catalogue.get("helpers", [])):
                  raise RuntimeError(f"{label} helper count differs between current scan/export paths")
              if len(scan_doc.get("tables", [])) != len(catalogue.get("candidates", [])):
                  raise RuntimeError(f"{label} table count differs between current scan/export paths")
              return rom, scan_doc, {
                  "per_call_json": str(machine_json),
                  "per_call_tsv_dir": str(tsv_dir),
                  "helper_count": len(helpers),
                  "call_count": len(calls),
                  "resolved_call_count": sum(1 for c in calls if c.get("table") is not None),
                  "table_count": len({c["table"] for c in calls if c.get("table") is not None}),
              }

          def write_catalogue_tsv(label, catalogue):
              prefix = label.lower()
              p = OUT / f"{prefix}.per_address.tsv"
              with p.open("w", encoding="utf-8", newline="") as f:
                  w = csv.writer(f, delimiter="\t", lineterminator="\n")
                  w.writerow([
                      "candidate_id", "base_hex", "address_space", "call_pcs",
                      "helper_addresses", "helper_kinds", "geometry_variants",
                      "axis1_variants", "axis2_variants", "axis_links", "spans",
                      "resolution_statuses",
                  ])
                  for c in catalogue.get("candidates", []):
                      w.writerow([
                          c.get("candidate_id"), c.get("base_hex"), c.get("address_space"),
                          json.dumps(c.get("call_pcs", []), sort_keys=True),
                          json.dumps(c.get("helper_addresses", []), sort_keys=True),
                          json.dumps(c.get("helper_kinds", []), sort_keys=True),
                          json.dumps(c.get("geometry_variants", []), sort_keys=True),
                          json.dumps(c.get("axis1_variants", []), sort_keys=True),
                          json.dumps(c.get("axis2_variants", []), sort_keys=True),
                          json.dumps(c.get("axis_links", []), sort_keys=True),
                          json.dumps(c.get("spans", []), sort_keys=True),
                          json.dumps(c.get("resolution_statuses", []), sort_keys=True),
                      ])
              return p

          def geometry_key(v):
              return (v.get("element_type"), v.get("dim1"), v.get("dim2"), v.get("byte_length"))

          def diff_ranges(a, b):
              changed = [i for i, (x, y) in enumerate(zip(a, b)) if x != y]
              if not changed:
                  return []
              ranges = []
              start = prev = changed[0]
              for x in changed[1:]:
                  if x != prev + 1:
                      ranges.append({"start_offset": start, "end_offset_inclusive": prev, "changed_bytes": prev - start + 1})
                      start = x
                  prev = x
              ranges.append({"start_offset": start, "end_offset_inclusive": prev, "changed_bytes": prev - start + 1})
              return ranges

          # 1. Reproduce the historic index identity before touching it.
          if not BASE_ZIP.exists():
              raise FileNotFoundError(f"previous corpus artifact missing: {BASE_ZIP}")
          with zipfile.ZipFile(BASE_ZIP) as zf:
              names = zf.namelist()
              if "rr_roms_reference_index.json" not in names:
                  raise RuntimeError("previous corpus artifact has no root rr_roms_reference_index.json")
              base_raw = zf.read("rr_roms_reference_index.json")
          if sha256_bytes(base_raw) != BASE_INDEX_SHA256:
              raise RuntimeError("prior reference-index SHA-256 does not match the published corpus report")
          base_index_path = OUT / "base_150_rom_reference_index.json"
          base_index_path.write_bytes(base_raw)
          ref_index = json.loads(base_raw)
          if len(ref_index["sources"]["donor_roms"]) != 150 or len(ref_index["sources"]["xml_documents"]) != 7:
              raise RuntimeError("prior reference index counts do not match the published 150-ROM / 7-XML baseline")

          # 2. Current workbench complete scan + lossless candidate catalogues.
          v6_cat, v6_cli_outputs, v6_scan_stdout = run_scan("V6", V6)
          el_cat, el_cli_outputs, el_scan_stdout = run_scan("EL19A", EL)
          v6_rom, v6_scan_doc, v6_call_stats = call_export("V6", V6, v6_cat)
          el_rom, el_scan_doc, el_call_stats = call_export("EL19A", EL, el_cat)
          v6_addr_tsv = write_catalogue_tsv("V6", v6_cat)
          el_addr_tsv = write_catalogue_tsv("EL19A", el_cat)

          v6_input_sha = v6_scan_doc["input"]["container_sha256"]
          v6_decoded_sha = v6_scan_doc["input"]["decoded_rom_sha256"]
          if v6_input_sha != HISTORICAL["container_sha256"]:
              raise RuntimeError("V6 source-container identity changed from the historical 306-table input")
          v6_stats = dict(v6_call_stats)
          v6_stats["container_sha256"] = v6_input_sha
          v6_stats["decoded_rom_sha256"] = v6_decoded_sha
          v6_reconcile = {
              "historical_baseline": HISTORICAL,
              "current_result": v6_stats,
              "container_identity_match": v6_input_sha == HISTORICAL["container_sha256"],
              "metric_deltas": {
                  "helper_count": v6_stats["helper_count"] - HISTORICAL["helper_count"],
                  "call_count": v6_stats["call_count"] - HISTORICAL["call_count"],
                  "resolved_call_count": v6_stats["resolved_call_count"] - HISTORICAL["resolved_call_count"],
                  "table_count": v6_stats["table_count"] - HISTORICAL["table_count"],
              },
              "all_historical_counts_reproduced": all(
                  v6_stats[k] == HISTORICAL[k] for k in ("helper_count", "call_count", "resolved_call_count", "table_count")
              ),
              "historical_per_address_baseline": "NOT_PUBLISHED_AS_MACHINE_READABLE_INPUT",
              "address_level_reconciliation": "Current per-address catalogue is the canonical preserved address inventory; historical published records provide matching source identity and aggregate counts only, so no unsupported historical address-by-address set claim is made.",
              "wo70019_correction": "Its zero-helper/zero-table V6 row is an input-classification error: it mislabeled the Intel HEX ROM as an A2L source. The workbench documented result and current rerun identify it as a SH705822N ROM with 36 helpers and 306 tables. The old matrix row is superseded for this V6 input only.",
          }

          # 3. Promote V6 to a first-class ROM donor in the existing 150-ROM reference index.
          from romraider_ref_index import index_rom_signature, parse_a2l_relational, match_target_against_index
          a2l_sha = sha256_file(A2L)
          v6_ref = index_rom_signature(V6, a2l_source_sha256=a2l_sha)
          if v6_ref["decoded_rom_sha256"] != v6_decoded_sha:
              raise RuntimeError("ref-index V6 decoder output differs from current workbench scan")
          if v6_ref["table_count"] != len(v6_cat.get("candidates", [])):
              raise RuntimeError("ref-index V6 table inventory differs from lossless per-address catalogue")
          v6_rom_id = v6_ref["rom_id"]
          v6_ref["a2l_pairing_status"] = PAIRING_STATUS
          v6_ref["a2l_pairing_basis"] = PAIRING_BASIS
          ref_index["sources"]["donor_roms"].append({
              "rom_id": v6_ref["rom_id"],
              "path": v6_ref["source_path"],
              "container_sha256": v6_ref["container_sha256"],
              "decoded_rom_sha256": v6_ref["decoded_rom_sha256"],
              "fid": v6_ref["fid"],
              "layout": v6_ref["layout"],
              "code_region_sha256": v6_ref["code_region_sha256"],
              "table_count": v6_ref["table_count"],
              "a2l_source_sha256": a2l_sha,
              "a2l_pairing_status": PAIRING_STATUS,
              "a2l_pairing_basis": PAIRING_BASIS,
          })
          ref_index["sources"]["donor_roms"].sort(key=lambda r: (r.get("fid") or "", r.get("rom_id") or ""))
          a2l_doc = parse_a2l_relational(A2L)
          a2l_doc["a2l_pairing_status"] = PAIRING_STATUS
          a2l_doc["a2l_pairing_basis"] = PAIRING_BASIS
          for sym in a2l_doc.get("symbols", []):
              sym["a2l_pairing_status"] = PAIRING_STATUS
              sym["a2l_pairing_basis"] = PAIRING_BASIS
          ref_index["a2l"].append(a2l_doc)
          ref_index["a2l"].sort(key=lambda a: a.get("source_id", ""))
          ref_index["sources"]["a2l_files"].append({
              "source_id": a2l_doc["source_id"],
              "path": a2l_doc["source_path"],
              "sha256": a2l_doc["source_sha256"],
              "symbol_count": len(a2l_doc.get("symbols", [])),
              "a2l_pairing_status": PAIRING_STATUS,
              "a2l_pairing_basis": PAIRING_BASIS,
          })
          ref_index["sources"]["a2l_files"].sort(key=lambda a: a.get("source_id", ""))

          for sym in a2l_doc.get("symbols", []):
              addr = sym.get("address_hex")
              if addr:
                  ref_index["lookups"]["a2l_by_addr"].setdefault(addr, []).append(sym)

          for tp in v6_ref.get("table_payloads", []):
              key = f'{tp["payload_sha256"]}:{tp["byte_length"]}'
              ref_index["lookups"]["payload_index"].setdefault(key, []).append({
                  "rom_id": v6_ref["rom_id"],
                  "source_path": v6_ref["source_path"],
                  "decoded_rom_sha256": v6_ref["decoded_rom_sha256"],
                  "address": tp["address"],
                  "address_hex": tp["address_hex"],
                  "helper_kind": tp["helper_kind"],
                  "element_type": tp["element_type"],
                  "dim1": tp["dim1"],
                  "dim2": tp["dim2"],
                  "byte_length": tp["byte_length"],
                  "distinct_byte_values": tp["distinct_byte_values"],
              })
          if v6_ref.get("code_region_sha256"):
              ref_index["lookups"]["code_hash_index"].setdefault(v6_ref["code_region_sha256"], []).append({
                  "rom_id": v6_ref["rom_id"],
                  "source_path": v6_ref["source_path"],
                  "decoded_rom_sha256": v6_ref["decoded_rom_sha256"],
                  "fid": v6_ref["fid"],
                  "code_start": v6_ref["layout"]["code_start"],
                  "code_end_exclusive": v6_ref["layout"]["code_end_exclusive"],
              })
          for key in ref_index["lookups"]["payload_index"]:
              ref_index["lookups"]["payload_index"][key].sort(key=lambda x: (x.get("source_path", ""), x.get("address", -1)))
          for key in ref_index["lookups"]["code_hash_index"]:
              ref_index["lookups"]["code_hash_index"][key].sort(key=lambda x: (x.get("source_path", ""), x.get("rom_id", "")))
          ref_index.setdefault("pairing_associations", []).append({
              "rom_id": v6_ref["rom_id"],
              "rom_path": str(V6),
              "rom_container_sha256": v6_input_sha,
              "a2l_source_id": a2l_doc["source_id"],
              "a2l_path": str(A2L),
              "a2l_sha256": a2l_sha,
              "status": PAIRING_STATUS,
              "basis": PAIRING_BASIS,
          })
          merged_index_path = OUT / "sh705x_reference_index_151_roms_plus_v6_a2l.json"
          write_json(merged_index_path, ref_index)

          # 4. Explicitly compute target↔V6 exact payload and same-geometry difference relationships.
          v6_by_payload = defaultdict(list)
          v6_by_geometry = defaultdict(list)
          for c in v6_cat.get("candidates", []):
              for gv in c.get("geometry_variants", []):
                  item = {
                      "address": c["base"], "address_hex": c["base_hex"],
                      "helper_kinds": c.get("helper_kinds", []),
                      "variant": gv,
                  }
                  pkey = (gv.get("payload_sha256"), gv.get("byte_length"))
                  if pkey[0] and pkey[1]:
                      v6_by_payload[pkey].append(item)
                  gkey = geometry_key(gv)
                  if all(x is not None for x in gkey):
                      v6_by_geometry[gkey].append(item)

          exact_pairs = []
          same_geometry_diff_pairs = []
          for ec in el_cat.get("candidates", []):
              for eg in ec.get("geometry_variants", []):
                  pkey = (eg.get("payload_sha256"), eg.get("byte_length"))
                  for d in v6_by_payload.get(pkey, []) if pkey[0] and pkey[1] else []:
                      exact_pairs.append({
                          "el19a_address": ec["base_hex"],
                          "v6_address": d["address_hex"],
                          "payload_sha256": pkey[0],
                          "byte_length": pkey[1],
                          "el19a_geometry": eg,
                          "v6_geometry": d["variant"],
                          "same_geometry": geometry_key(eg) == geometry_key(d["variant"]),
                          "el19a_helper_kinds": ec.get("helper_kinds", []),
                          "v6_helper_kinds": d["helper_kinds"],
                      })
                  gkey = geometry_key(eg)
                  if all(x is not None for x in gkey):
                      for d in v6_by_geometry.get(gkey, []):
                          dv = d["variant"]
                          if (eg.get("payload_sha256"), eg.get("byte_length")) == (dv.get("payload_sha256"), dv.get("byte_length")):
                              continue
                          ea = ec["base"]
                          da = d["address"]
                          n = eg["byte_length"]
                          ebytes = el_rom[ea:ea+n]
                          dbytes = v6_rom[da:da+n]
                          if len(ebytes) != n or len(dbytes) != n:
                              continue
                          ranges = diff_ranges(ebytes, dbytes)
                          same_geometry_diff_pairs.append({
                              "el19a_address": ec["base_hex"],
                              "v6_address": d["address_hex"],
                              "geometry": {
                                  "element_type": gkey[0], "dim1": gkey[1], "dim2": gkey[2], "byte_length": gkey[3],
                              },
                              "el19a_payload_sha256": eg.get("payload_sha256"),
                              "v6_payload_sha256": dv.get("payload_sha256"),
                              "changed_bytes": sum(r["changed_bytes"] for r in ranges),
                              "difference_ranges": ranges,
                              "el19a_helper_kinds": ec.get("helper_kinds", []),
                              "v6_helper_kinds": d["helper_kinds"],
                          })

          exact_pairs.sort(key=lambda x: (x["el19a_address"], x["v6_address"], x["payload_sha256"]))
          same_geometry_diff_pairs.sort(key=lambda x: (x["el19a_address"], x["v6_address"]))
          exact_target_addresses = sorted({x["el19a_address"] for x in exact_pairs})
          exact_v6_addresses = sorted({x["v6_address"] for x in exact_pairs})
          same_geometry_target_addresses = sorted({x["el19a_address"] for x in same_geometry_diff_pairs})
          same_geometry_v6_addresses = sorted({x["v6_address"] for x in same_geometry_diff_pairs})
          payload_comparison = {
              "schema": "el19a-v6-donor-comparison-v1",
              "target_rom": {
                  "path": str(EL), "container_sha256": sha256_file(EL),
                  "decoded_rom_sha256": el_cat["manifest"]["input"]["decoded_rom_sha256"],
                  "candidate_count": len(el_cat.get("candidates", [])),
              },
              "donor_rom": {
                  "path": str(V6), "container_sha256": v6_input_sha,
                  "decoded_rom_sha256": v6_decoded_sha,
                  "candidate_count": len(v6_cat.get("candidates", [])),
                  "fid": v6_ref.get("fid"), "processor": v6_ref.get("fid_cpu"),
              },
              "exact_payload_match_pair_count": len(exact_pairs),
              "el19a_candidates_with_exact_v6_payload": len(exact_target_addresses),
              "unique_v6_candidates_in_exact_matches": len(exact_v6_addresses),
              "exact_payload_pairs": exact_pairs,
              "same_geometry_differing_payload_pair_count": len(same_geometry_diff_pairs),
              "el19a_candidates_with_same_geometry_different_v6_payload": len(same_geometry_target_addresses),
              "unique_v6_candidates_in_same_geometry_differences": len(same_geometry_v6_addresses),
              "same_geometry_differing_payload_pairs": same_geometry_diff_pairs,
              "geometry_definition": "same element_type, dim1, dim2 and byte_length; helper-kind equivalence is recorded separately",
              "semantics_boundary": "All V6 matches are donor structural evidence only; no A2L name, unit, conversion or physical meaning is established for EL19A.",
          }
          payload_json = OUT / "el19a_v6_payload_comparison.json"
          write_json(payload_json, payload_comparison)
          payload_tsv = OUT / "el19a_v6_payload_comparison.tsv"
          with payload_tsv.open("w", encoding="utf-8", newline="") as f:
              w = csv.writer(f, delimiter="\t", lineterminator="\n")
              w.writerow(["comparison_class", "el19a_address", "v6_address", "byte_length", "geometry", "payload_sha256_el19a", "payload_sha256_v6", "changed_bytes", "difference_ranges", "same_geometry"])
              for x in exact_pairs:
                  w.writerow(["exact_payload", x["el19a_address"], x["v6_address"], x["byte_length"], json.dumps(x["el19a_geometry"], sort_keys=True), x["payload_sha256"], x["payload_sha256"], 0, "[]", x["same_geometry"]])
              for x in same_geometry_diff_pairs:
                  w.writerow(["same_geometry_different_payload", x["el19a_address"], x["v6_address"], x["geometry"]["byte_length"], json.dumps(x["geometry"], sort_keys=True), x["el19a_payload_sha256"], x["v6_payload_sha256"], x["changed_bytes"], json.dumps(x["difference_ranges"], sort_keys=True), True])

          # 5. Run the workbench's own donor diff command and retain its machine output/logs.
          official_diff_json = OUT / "workbench_el19a_vs_v6_diff.json"
          official_diff_cmd = [
              sys.executable, "tools/nissan_sh705x_workbench.py", "diff", str(EL), str(V6),
              "--xml", "CALIBRATIONS/EL19A_release1_conservative.xml",
              "--raw-limit", "0", "--json-out", str(official_diff_json),
          ]
          diff_proc = subprocess.run(official_diff_cmd, text=True, capture_output=True, timeout=1800)
          (LOGS / "workbench_el19a_vs_v6_diff.stdout.txt").write_text(diff_proc.stdout, encoding="utf-8")
          (LOGS / "workbench_el19a_vs_v6_diff.stderr.txt").write_text(diff_proc.stderr, encoding="utf-8")
          if diff_proc.returncode != 0:
              raise RuntimeError(f"workbench diff failed ({diff_proc.returncode}): {diff_proc.stderr[-3000:]}")

          # 6. Run the canonical matcher over the 151-ROM index and retain only V6 rows for this handoff.
          crossref = match_target_against_index(el_cat, ref_index, target_rom=el_rom)
          v6_candidates = {}
          for addr, item in crossref.get("candidates", {}).items():
              payload_hits = [h for h in item.get("payload_hits", []) if h.get("rom_id") == v6_rom_id]
              a2l_hits = []
              for h in item.get("a2l_same_address_hits", []):
                  h2 = dict(h)
                  h2["a2l_pairing_status"] = PAIRING_STATUS
                  h2["a2l_pairing_basis"] = PAIRING_BASIS
                  h2["is_target_proof"] = False
                  a2l_hits.append(h2)
              if payload_hits or a2l_hits:
                  v6_candidates[addr] = {
                      "candidate_id": item["candidate_id"],
                      "address": item["address"],
                      "address_hex": addr,
                      "v6_payload_hits": payload_hits,
                      "v6_a2l_same_address_associations": a2l_hits,
                      "a2l_pairing_status": PAIRING_STATUS,
                      "evidence_class": "donor",
                      "is_target_proof": False,
                  }
          crossref_out = {
              "schema": "el19a-v6-provisional-donor-crossref-v1",
              "target_rom_sha256": crossref.get("target_rom_sha256"),
              "target_fid": crossref.get("target_fid"),
              "v6_rom_id": v6_rom_id,
              "v6_a2l_source_id": a2l_doc["source_id"],
              "a2l_pairing_status": PAIRING_STATUS,
              "a2l_pairing_basis": PAIRING_BASIS,
              "matching_el19a_candidate_count": len(v6_candidates),
              "candidates": v6_candidates,
              "evidence_boundary": "Payload and same-address A2L associations are donor leads, not EL19A target proof.",
          }
          write_json(OUT / "el19a_v6_provisional_crossref.json", crossref_out)

          # 7. Verify merged index cardinalities and build the immutable run summary.
          if len(ref_index["sources"]["donor_roms"]) != 151:
              raise RuntimeError("merged reference index does not contain exactly 151 donor ROMs")
          if len(ref_index["sources"]["a2l_files"]) != 1 or len(ref_index["a2l"]) != 1:
              raise RuntimeError("merged reference index must contain exactly the one provisional V6 A2L source")
          if v6_ref["table_count"] != 306:
              # A count mismatch is reportable, not silently forced. Current per-address candidate count is authoritative.
              pass

          summary = {
              "schema": "v6-first-class-donor-run-v1",
              "status": "COMPLETE",
              "workbench_python": sys.version,
              "workbench_source_hashes": {
                  p: sha256_file(p) for p in (
                      "tools/nissan_sh705x_workbench.py",
                      "tools/sh7058_cross_rom_scanner.py",
                      "tools/sh705x_discovery_v2.py",
                      "tools/romraider_ref_index.py",
                      "tools/sh705x_rom_loader.py",
                  )
              },
              "base_index": {
                  "artifact_run_id": 46023911353,
                  "artifact_name": "rr-roms-workbench-refresh",
                  "sha256": BASE_INDEX_SHA256,
                  "donor_rom_count": 150,
                  "xml_document_count": 7,
                  "reused_without_rescanning": True,
              },
              "v6_historical_reconciliation": v6_reconcile,
              "v6_current_scan": {
                  **v6_stats,
                  "a2l_source_container_sha256": a2l_sha,
                  "a2l_pairing_status": PAIRING_STATUS,
                  "a2l_symbol_count": len(a2l_doc.get("symbols", [])),
                  "a2l_addressed_symbol_count": sum(1 for x in a2l_doc.get("symbols", []) if x.get("address_hex")),
                  "a2l_exact_same_address_table_candidate_count": sum(
                      1 for c in v6_cat.get("candidates", [])
                      if any(s.get("address_hex") == c.get("base_hex") for s in a2l_doc.get("symbols", []))
                  ),
                  "candidate_count_in_lossless_catalogue": len(v6_cat.get("candidates", [])),
                  "observation_count_in_lossless_catalogue": len(v6_cat.get("observations", [])),
                  "axis_count_in_lossless_catalogue": len(v6_cat.get("axes", [])),
                  "per_call_exports": v6_call_stats,
              },
              "el19a_current_scan": {
                  **el_call_stats,
                  "decoded_rom_sha256": el_cat["manifest"]["input"]["decoded_rom_sha256"],
                  "candidate_count_in_lossless_catalogue": len(el_cat.get("candidates", [])),
                  "observation_count_in_lossless_catalogue": len(el_cat.get("observations", [])),
                  "axis_count_in_lossless_catalogue": len(el_cat.get("axes", [])),
              },
              "merged_reference_index": {
                  "path": str(merged_index_path),
                  "sha256": sha256_file(merged_index_path),
                  "donor_rom_count": len(ref_index["sources"]["donor_roms"]),
                  "xml_document_count": len(ref_index["sources"]["xml_documents"]),
                  "a2l_file_count": len(ref_index["sources"]["a2l_files"]),
                  "payload_hash_length_key_count": len(ref_index["lookups"]["payload_index"]),
                  "code_region_hash_key_count": len(ref_index["lookups"]["code_hash_index"]),
                  "v6_table_payload_count": v6_ref["table_count"],
                  "v6_rom_id": v6_rom_id,
                  "a2l_pairing_status": PAIRING_STATUS,
              },
              "el19a_v6_comparison": {
                  "custom_payload_matrix": str(payload_json),
                  "custom_payload_matrix_sha256": sha256_file(payload_json),
                  "official_workbench_diff_stdout": str(LOGS / "workbench_el19a_vs_v6_diff.stdout.txt"),
                  "official_workbench_diff_json_created": official_diff_json.exists(),
                  "exact_payload_match_pair_count": len(exact_pairs),
                  "el19a_addresses_with_exact_payload": len(exact_target_addresses),
                  "same_geometry_differing_payload_pair_count": len(same_geometry_diff_pairs),
                  "el19a_addresses_with_same_geometry_differences": len(same_geometry_target_addresses),
                  "provisional_v6_crossref_candidate_count": len(v6_candidates),
              },
              "output_paths": sorted(str(p) for p in OUT.rglob("*") if p.is_file()),
          }
          write_json(OUT / "summary.json", summary)
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          python /tmp/run_v6_first_class_donor.py

      - name: Upload V6 first-class donor evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-first-class-donor
          path: workbench-output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
