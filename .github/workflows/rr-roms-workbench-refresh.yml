name: Temporary RR ROMs workbench refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rr-roms-workbench-refresh.yml"

permissions:
  contents: read

jobs:
  rr-roms-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout workbench and RR ROM evidence only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            EVIDENCE/rr roms
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile workbench
        run: |
          python -m py_compile tools/nissan_sh705x_workbench.py tools/sh705x_rom_loader.py tools/sh7058_cross_rom_scanner.py tools/sh705x_discovery_v2.py tools/romraider_ref_index.py
      - name: Scan refreshed RR ROM corpus and build reference index
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json, re, subprocess, sys, time, traceback
          from collections import Counter, defaultdict
          from pathlib import Path
          root=Path("EVIDENCE/rr roms"); out=Path("workbench-output"); scans=out/"scans"; logs=out/"logs"
          scans.mkdir(parents=True,exist_ok=True); logs.mkdir(parents=True,exist_ok=True)
          supported={".bin",".zip",".s19",".hex",".dat"}
          paths=sorted(p for p in root.iterdir() if p.is_file())
          xml_paths=[str(p) for p in paths if p.suffix.lower()==".xml"]
          records=[]; by_container_sha={}; successful=[]; start=time.time()
          def sha256(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""):h.update(b)
              return h.hexdigest()
          def slug(n):return (re.sub(r"[^A-Za-z0-9._-]+","_",n).strip("._") or "rom")[:70]
          print("FOLDER FILE COUNT:",len(paths));print("XML DEFINITION INPUTS:",len(xml_paths))
          for n,p in enumerate(paths,1):
              sz=p.stat().st_size; dh=sha256(p)
              rec={"path":str(p),"filename":p.name,"bytes":sz,"container_sha256":dh}
              if p.suffix.lower() not in supported:
                  rec["status"]="SKIPPED_NON_ROM_OR_UNSUPPORTED"
                  rec["extension"]=p.suffix.lower() or "(none)"
                  records.append(rec);print(f"[{n}/{len(paths)}] SKIP {p.name}");continue
              if dh in by_container_sha:
                  rec["status"]="EXACT_CONTAINER_DUPLICATE";rec["duplicate_of"]=by_container_sha[dh]
                  records.append(rec);print(f"[{n}/{len(paths)}] DUPLICATE {p.name}");continue
              by_container_sha[dh]=str(p)
              stem=dh[:12]+"_"+slug(p.name)
              tsv=scans/(stem+".tables.tsv");js=scans/(stem+".scan.json");cat=scans/(stem+".catalogue.json");man=scans/(stem+".manifest.json")
              cmd=[sys.executable,"tools/nissan_sh705x_workbench.py","scan",str(p),"--tsv",str(tsv),"--json",str(js),"--catalogue",str(cat),"--manifest",str(man)]
              print(f"[{n}/{len(paths)}] SCAN {p.name} ({sz} bytes)")
              try:
                  proc=subprocess.run(cmd,capture_output=True,text=True,timeout=600)
                  (logs/(stem+".stdout.txt")).write_text(proc.stdout,encoding="utf-8")
                  (logs/(stem+".stderr.txt")).write_text(proc.stderr,encoding="utf-8")
                  rec["exit_code"]=proc.returncode;rec["status"]="SCAN_OK" if proc.returncode==0 else "SCAN_FAILED"
                  if proc.returncode==0:successful.append(str(p))
                  rec["stdout_log"]=str(logs/(stem+".stdout.txt"));rec["stderr_log"]=str(logs/(stem+".stderr.txt"))
                  if js.exists():
                      doc=json.loads(js.read_text(encoding="utf-8"));fp=doc.get("fingerprint",{});meta=fp.get("nissan_meta",{})
                      rec.update({"decoded_rom_sha256":fp.get("sha256"),"decoded_size":fp.get("size"),
                                  "cpu_tags":fp.get("cpu_tags"),"fid_tags":fp.get("fid_tags"),
                                  "loader":meta.get("loader"),"fid":meta.get("fid"),"fid_cpu":meta.get("fid_cpu"),
                                  "checksums":fp.get("checksums"),"helper_count":len(doc.get("helpers",{})),
                                  "table_count":len(doc.get("tables",{}))})
                  m=re.search(r"Call sites: (\d+) total, (\d+) resolved -> (\d+) unique tables",proc.stdout)
                  if m:rec.update({"call_sites":int(m.group(1)),"resolved_calls":int(m.group(2)),"unique_tables":int(m.group(3))})
                  rec["outputs"]={k:str(v) for k,v in {"tsv":tsv,"json":js,"catalogue":cat,"manifest":man}.items() if v.exists()}
                  if proc.returncode:rec["error_excerpt"]=(proc.stderr or proc.stdout)[-3000:]
              except subprocess.TimeoutExpired as e:rec.update({"status":"SCAN_TIMEOUT","error_excerpt":str(e)})
              except Exception as e:rec.update({"status":"RUNNER_ERROR","error_excerpt":repr(e)})
              records.append(rec)
          # Add XMLs to the ROM reference index; indexer preserves duplicate source documents and all conflicts.
          ref={"status":"NOT_RUN","rom_inputs":len(successful),"xml_inputs":len(xml_paths)}
          if successful and xml_paths:
              idxpath=out/"rr_roms_reference_index.json"
              cmd=[sys.executable,"tools/nissan_sh705x_workbench.py","ref-index","build","--out",str(idxpath),"--xml"]+xml_paths+["--rom"]+successful
              print(f"BUILD REF INDEX: {len(successful)} ROMs + {len(xml_paths)} XML sources")
              try:
                  p=subprocess.run(cmd,capture_output=True,text=True,timeout=3600)
                  (logs/"ref-index.stdout.txt").write_text(p.stdout,encoding="utf-8");(logs/"ref-index.stderr.txt").write_text(p.stderr,encoding="utf-8")
                  ref.update({"exit_code":p.returncode,"status":"OK" if p.returncode==0 else "FAILED",
                              "stdout_log":str(logs/"ref-index.stdout.txt"),"stderr_log":str(logs/"ref-index.stderr.txt")})
                  if idxpath.exists():
                      idx=json.loads(idxpath.read_text(encoding="utf-8"));ref.update({
                          "index_sha256":sha256(idxpath),"indexed_roms":len(idx.get("sources",{}).get("donor_roms",[])),
                          "xml_documents":len(idx.get("sources",{}).get("xml_documents",[])),
                          "xml_symbol_addresses":len(idx.get("lookups",{}).get("xml_by_addr",{})),
                          "payload_hash_keys":len(idx.get("lookups",{}).get("payload_index",{})),
                          "code_region_hash_keys":len(idx.get("lookups",{}).get("code_hash_index",{}))})
              except subprocess.TimeoutExpired as e:ref.update({"status":"TIMEOUT","error":str(e)})
              except Exception as e:ref.update({"status":"RUNNER_ERROR","error":repr(e),"traceback":traceback.format_exc()})
          decoded=defaultdict(list)
          for x in records:
              if x.get("status")=="SCAN_OK" and x.get("decoded_rom_sha256"):decoded[x["decoded_rom_sha256"]].append(x["path"])
          for x in records:
              if x.get("decoded_rom_sha256"):
                  g=decoded[x["decoded_rom_sha256"]];x["decoded_duplicate_count"]=len(g)
                  if len(g)>1:x["decoded_duplicate_paths"]=g
          counts=Counter(x["status"] for x in records)
          summary={"schema":"rr-roms-workbench-refresh-v1","repo_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                   "python":sys.version,"folder_count":len(paths),"status_counts":dict(counts),
                   "unique_container_rom_scans":len(successful),"decoded_hash_groups":len(decoded),
                   "decoded_duplicate_groups":sum(1 for g in decoded.values() if len(g)>1),
                   "call_sites_total":sum(x.get("call_sites",0) for x in records),
                   "resolved_calls_total":sum(x.get("resolved_calls",0) for x in records),
                   "unique_table_instances_total":sum(x.get("unique_tables",0) for x in records),
                   "identified_cpu_fid_roms":sum(1 for x in records if x.get("fid") or x.get("cpu_tags")),
                   "unidentified_roms": [x["path"] for x in records if x.get("status")=="SCAN_OK" and not x.get("fid") and not x.get("cpu_tags")],
                   "tool_hashes":{str(p):sha256(p) for p in [Path("tools/nissan_sh705x_workbench.py"),Path("tools/sh705x_rom_loader.py"),Path("tools/sh7058_cross_rom_scanner.py"),Path("tools/sh705x_discovery_v2.py"),Path("tools/romraider_ref_index.py")]},
                   "ref_index":ref,"elapsed_seconds":round(time.time()-start,3),"records":records}
          (out/"rr_roms_refresh_summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          with (out/"rr_roms_refresh_inventory.tsv").open("w",encoding="utf-8",newline="") as f:
              cols=sorted({k for x in records for k in x if not isinstance(x.get(k),(dict,list))})
              w=csv.DictWriter(f,fieldnames=cols,delimiter="\t",extrasaction="ignore");w.writeheader()
              for x in records:w.writerow({k:json.dumps(v,sort_keys=True) if isinstance(v,(dict,list)) else v for k,v in x.items()})
          print("FINAL STATUS COUNTS:",dict(counts))
          print("ROM SCANS:",len(successful),"DECODED HASH GROUPS:",len(decoded))
          print("TOTAL CALLS:",summary["call_sites_total"],"RESOLVED:",summary["resolved_calls_total"],"TABLE INSTANCES:",summary["unique_table_instances_total"])
          print("IDENTIFIED CPU/FID:",summary["identified_cpu_fid_roms"],"UNIDENTIFIED:",len(summary["unidentified_roms"]))
          print("REFERENCE INDEX:",json.dumps(ref,sort_keys=True))
          PY
      - name: Upload workbench evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-roms-workbench-refresh
          path: workbench-output/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
